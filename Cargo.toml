[workspace]
resolver = "3"
members = [
    "crates/cetvel-model",
    "crates/cetvel-tahmin",
    "crates/cetvel-ajan",
    "crates/cetvel-baglayici",
    "crates/cetvel-depo",
    "crates/cetvel-servis",
    "crates/cetvel-mcp",
    "crates/cetvel",
    "crates/cetvel-masaustu",
]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
cetvel-model = { path = "crates/cetvel-model" }
cetvel-tahmin = { path = "crates/cetvel-tahmin" }
cetvel-ajan = { path = "crates/cetvel-ajan" }
cetvel-baglayici = { path = "crates/cetvel-baglayici" }
cetvel-depo = { path = "crates/cetvel-depo" }
cetvel-servis = { path = "crates/cetvel-servis" }
cetvel-mcp = { path = "crates/cetvel-mcp" }

axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "charset", "http2"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
schemars = { version = "1.2.3", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros", "serde"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "time", "io-util", "io-std", "sync", "signal", "net"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
winreg = "0.56.0"

[workspace.dependencies.windows]
version = "0.62.2"
features = [
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_Storage_EnhancedStorage",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_JobObjects",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_TaskScheduler",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
]

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
